<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FEED - Página 1</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <img src="./image.png" alt="Logo">

        <h1>SITE PARA ATUALIZAÇÕES</h1>

    </header>

<main>

    <a class="botao-nova-atualizacao" href="./criar-atualizacao.html">
        + Criar Nova Atualização
    </a>

    <!-- Área dos filtros -->
    <section class="painel-filtros">

        <div class="grupo-filtro grupo-pesquisa">

            <label for="entrada">Pesquisar atualização:</label>

            <div class="campo-pesquisa">

                <input
                    id="entrada"
                    type="text"
                    placeholder="Digite o título ou ID..."
                >

                <button type="button" id="botaoPesquisar">
                    Pesquisar
                </button>

            </div>

        </div>

        <div class="grupo-filtro">

            <label for="filtroArea">Filtrar por área:</label>

            <select id="filtroArea">
                <option value="">Todas as áreas</option>
                <option value="Gestão Interna e Finanças">Gestão Interna e Finanças</option>
                <option value="Pessoas">Pessoas</option>
                <option value="Projetos">Projetos</option>
                <option value="Marketing">Marketing</option>
                <option value="Mercado">Mercado</option>
            </select>

        </div>

        <div class="grupo-filtro">

            <label for="dataInicial">Data inicial:</label>

            <input type="date" id="dataInicial">

        </div>

        <div class="grupo-filtro">

            <label for="dataFinal">Data final:</label>

            <input type="date" id="dataFinal">

        </div>

    </section>

    <h2>Atualizações disponíveis:</h2>

    <div id="resultados"></div>

</main>

    <script src="script.js"></script>

</body>

</html>
